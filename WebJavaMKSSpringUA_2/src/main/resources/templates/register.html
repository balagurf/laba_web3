<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Travelling Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .register-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }

        /* Стили капчи */
        .captcha-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 20px auto;
            border-radius: 50%;
            overflow: hidden;
            background: #eee;
        }

        .captcha-disk {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            /* Замени URL на свою картинку или оставь эту для теста */
            background-image: url('https://images.unsplash.com/photo-1488646953014-85cb44e25828?q=80&w=500&auto=format&fit=crop');
            background-size: 200px 200px;
            background-repeat: no-repeat;
        }

        /* Центр картинки (неподвижный) */
        .disk-inner {
            z-index: 2;
            -webkit-mask-image: radial-gradient(circle, black 40%, transparent 41%);
            mask-image: radial-gradient(circle, black 40%, transparent 41%);
        }

        /* Внешнее кольцо (вращающееся) */
        .disk-outer {
            z-index: 1;
            -webkit-mask-image: radial-gradient(circle, transparent 40%, black 41%);
            mask-image: radial-gradient(circle, transparent 40%, black 41%);
            transition: transform 0.1s ease-out;
        }

        .slider-label { font-size: 0.85rem; color: #6c757d; text-align: center; display: block; margin-top: 10px; }
    </style>
</head>
<body>

<div class="register-card">
    <h3 class="text-center fw-bold mb-4">Регистрация</h3>

    <form th:action="@{/register}" th:object="${userDto}" method="post">

        <input type="hidden" name="captchaId" th:value="${captchaId}">
        <input type="hidden" name="rotationAngle" id="rotationAngle" value="0">

        <div class="mb-3">
            <label class="form-label">Email адрес</label>
            <input type="email" th:field="*{email}" class="form-control" placeholder="example@mail.com" required>
            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger small mt-1"></div>
        </div>

        <div class="mb-4">
            <label class="form-label">Пароль</label>
            <input type="password" th:field="*{password}" class="form-control" placeholder="Минимум 6 символов" required>
            <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger small mt-1"></div>
        </div>

        <div class="form-check mb-4 text-start">
            <input class="form-check-input" type="checkbox" th:field="*{admin}" id="adminCheck">
            <label class="form-check-label" for="adminCheck">
                Сделать меня администратором (для теста)
            </label>
        </div>

        <div class="captcha-section mb-4">
            <div class="captcha-container">
                <div class="captcha-disk disk-inner"></div>
                <div class="captcha-disk disk-outer" id="outerDisk"
                     th:style="'transform: rotate(' + ${initialAngle} + 'deg)'"></div>
            </div>

            <label class="slider-label">Поверните диск, чтобы собрать пазл</label>
            <input type="range" class="form-range" id="captchaSlider" min="0" max="360" value="0">

            <div th:if="${captchaError}" class="text-danger small text-center mt-2" th:text="${captchaError}"></div>
        </div>

        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mb-3">Зарегистрироваться</button>

        <div class="text-center">
            <span class="text-muted">Уже есть аккаунт?</span>
            <a th:href="@{/login}" class="text-decoration-none fw-bold">Войти</a>
        </div>
    </form>
</div>

<script>
    const slider = document.getElementById('captchaSlider');
    const disk = document.getElementById('outerDisk');
    const angleInput = document.getElementById('rotationAngle');

    // Получаем начальный угол, который пришел с сервера
    const initialAngle = [[${initialAngle}]];

    slider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value);

        // Визуально крутим диск: начальное смещение + прогресс ползунка
        disk.style.transform = `rotate(${initialAngle + val}deg)`;

        // Записываем значение ползунка в скрытое поле для отправки в Java
        angleInput.value = val;
    });
</script>

</body>
</html>
