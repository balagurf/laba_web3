<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <style>
        .login-box { width: 320px; margin: 80px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; font-family: sans-serif; }
        .msg { padding: 10px; margin-bottom: 10px; border-radius: 4px; font-size: 14px; }
        .error { background: #f8d7da; color: #721c24; }
        .success { background: #d4edda; color: #155724; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<div class="login-box">
    <h3>Вход в систему</h3>

    <div th:if="${param.registered}" class="msg success">Регистрация успешна! Войдите.</div>
    <div th:if="${param.error}" class="msg error">Неверный Email или пароль.</div>
    <div th:if="${param.logout}" class="msg">Вы вышли из системы.</div>

    <form th:action="@{/login}" method="post">
        <input type="email" name="username" placeholder="Email" required autofocus>
        <input type="password" name="password" placeholder="Пароль" required>
        <button type="submit">Войти</button>
    </form>
    <p style="text-align: center; font-size: 14px;">
        Нет аккаунта? <a th:href="@{/register}">Создать</a>
    </p>
</div>
</body>
</html>
