<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация Путешественника</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow border-0 mx-auto" style="max-width: 800px;">
        <div class="card-header bg-dark text-white p-3">
            <h4 class="mb-0"><i class="bi bi-person-plus-fill me-2"></i> Данные Путешественника</h4>
        </div>
        <div class="card-body p-4">

            <form th:action="@{/travellers/save}" th:object="${traveller}" method="post">

                <!-- Ошибки тоже внутри тега form -->
                <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                    Убедитесь, что все обязательные поля заполнены верно.
                </div>

                <input type="hidden" th:field="*{id}">

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Имя *</label>
                        <input type="text" th:field="*{firstName}" class="form-control" th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:errors="*{firstName}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Фамилия *</label>
                        <input type="text" th:field="*{secondName}" class="form-control" th:classappend="${#fields.hasErrors('secondName')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:errors="*{secondName}"></div>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Телефон (+380...) *</label>
                        <input type="text" th:field="*{phone}" class="form-control" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:errors="*{phone}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Страна *</label>
                        <select th:field="*{countryCode}" class="form-select">
                            <option th:each="code : ${T(com.example.travelling2.model.CountryCode).values()}"
                                    th:value="${code}" th:text="${code}"></option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Код тура (генерируется автоматически)</label>
                    <input type="text" th:field="*{travelCod}" class="form-control bg-light" readonly>
                    <div class="text-danger small" th:errors="*{travelCod}"></div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Отель</label>
                        <input type="text" th:field="*{hotelName}" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Депозит ($)</label>
                        <input type="number" step="0.01" th:field="*{deposit}" class="form-control">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Комментарии</label>
                    <textarea th:field="*{comments}" class="form-control" rows="3"></textarea>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-dark w-100 py-2">СОХРАНИТЬ ДАННЫЕ</button>
                    <a th:href="@{/travellers}" class="btn btn-link w-100 mt-2 text-decoration-none text-muted">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
