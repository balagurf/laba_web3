<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Управление путешественниками</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --glass: rgba(255, 255, 255, 0.9); }
        body { background: #f0f2f5; font-family: 'Inter', sans-serif; }
        .filter-card { border: none; border-radius: 15px; background: var(--glass); backdrop-filter: blur(10px); }
        .table-container { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); overflow: hidden; }
        .thead-custom { background: #f8f9fa; border-bottom: 2px solid #eee; }
        .traveller-row { transition: 0.3s; border-bottom: 1px solid #f1f1f1; }
        .traveller-row:hover { background: #f8faff; transform: scale(1.002); }
        .badge-deposit { background: #e8f5e9; color: #2e7d32; font-weight: 600; padding: 0.5em 1em; border-radius: 8px; }
        .btn-action { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 10px; transition: 0.2s; }
    </style>
</head>
<body class="py-4">

<div class="d-flex justify-content-between align-items-center mb-4">
    <div class="d-flex align-items-center gap-3">
        <a th:href="@{/}" class="btn btn-white border rounded-circle shadow-sm d-flex align-items-center justify-content-center" style="width: 48px; height: 48px; background: white;" title="Вернуться в главное меню">
            <i class="bi bi-arrow-left fs-5 text-dark"></i>
        </a>
        <div>
            <h2 class="fw-bold mb-0">Реестр путешественников</h2>
            <p class="text-muted mb-0">Управление данными и фильтрация</p>
        </div>
    </div>
    <a th:href="@{/travellers/create}" class="btn btn-primary px-4 py-2 rounded-pill shadow-sm">
        <i class="bi bi-plus-lg me-2"></i>Добавить нового
    </a>
</div>

    <div class="card filter-card shadow-sm mb-4">
        <div class="card-body p-4">
            <form th:action="@{/travellers}" method="get" class="row g-3">
                <div class="col-md-3">
                    <label class="small fw-bold text-uppercase text-muted">Поиск по ФИО</label>
                    <input type="text" name="search" class="form-control" placeholder="Имя или фамилия..." th:value="${param.search}">
                </div>
                <div class="col-md-2">
                    <label class="small fw-bold text-uppercase text-muted">№ Паспорта</label>
                    <input type="text" name="passport" class="form-control" placeholder="Напр. AB123..." th:value="${param.passport}">
                </div>
                <div class="col-md-2">
                    <label class="small fw-bold text-uppercase text-muted">Страна</label>
                    <select name="country" class="form-select">
                        <option value="">Все страны</option>
                        <option th:each="c : ${countries}" th:value="${c}" th:text="${c}" th:selected="${param.country == c.name()}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="small fw-bold text-uppercase text-muted">Депозит (от - до)</label>
                    <div class="input-group">
                        <input type="number" name="minDeposit" class="form-control" placeholder="Мин" th:value="${param.minDeposit}">
                        <input type="number" name="maxDeposit" class="form-control" placeholder="Макс" th:value="${param.maxDeposit}">
                    </div>
                </div>
                <div class="col-md-2">
                    <label class="small fw-bold text-uppercase text-muted">Сортировка</label>
                    <select name="sortDir" class="form-select" onchange="this.form.submit()">
                        <option value="desc" th:selected="${param.sortDir == 'desc'}">Сначала богатые</option>
                        <option value="asc" th:selected="${param.sortDir == 'asc'}">Сначала новые</option>
                    </select>
                    <input type="hidden" name="sortField" th:value="${param.sortDir == 'desc' ? 'deposit' : 'id'}">
                </div>
                <div class="col-12 text-end mt-3 border-top pt-3">
                    <a th:href="@{/travellers}" class="btn btn-light px-4 me-2">Сбросить</a>
                    <button type="submit" class="btn btn-dark px-4"><i class="bi bi-filter me-2"></i>Применить</button>
                </div>
            </form>
        </div>
    </div>

    <div class="table-container shadow-sm">
        <table class="table table-borderless align-middle mb-0">
            <thead class="thead-custom">
            <tr>
                <th class="ps-4 py-3 text-muted small text-uppercase">Путешественник</th>
                <th class="py-3 text-muted small text-uppercase">Контакты</th>
                <th class="py-3 text-muted small text-uppercase">Локация</th>
                <th class="py-3 text-muted small text-uppercase">Депозит</th>
                <th class="pe-4 py-3 text-end text-muted small text-uppercase">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="t : ${travellers}" class="traveller-row">
                <td class="ps-4 py-3">
                    <div class="d-flex align-items-center">
                        <div class="bg-primary text-white rounded-circle me-3 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                            <span th:text="${t.firstName[0]} + ${t.secondName[0]}">UN</span>
                        </div>
                        <div>
                            <div class="fw-bold text-dark" th:text="${t.firstName} + ' ' + ${t.secondName}">Имя Фамилия</div>
                            <div class="small text-muted" th:text="'Код: ' + ${t.travelCod}">TR-123</div>
                        </div>
                    </div>
                </td>
                <td class="py-3">
                    <div class="small"><i class="bi bi-telephone text-muted me-2"></i><span th:text="${t.phone}">+373...</span></div>
                </td>
                <td class="py-3">
                    <span class="badge bg-light text-dark border" th:text="${t.countryCode}">MDA</span>
                </td>
                <td class="py-3">
                    <span class="badge-deposit" th:text="${#numbers.formatCurrency(t.deposit)}">$1,200</span>
                </td>
                <td class="pe-4 py-3 text-end">
                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/travellers/profile/{id}(id=${t.id})}" class="btn-action btn btn-info text-white shadow-sm" title="Профиль">
                            <i class="bi bi-eye"></i>
                        </a>
                        <div sec:authorize="hasRole('ADMIN')" class="d-flex gap-2">
                            <a th:href="@{/travellers/edit/{id}(id=${t.id})}" class="btn-action btn btn-warning shadow-sm" title="Правка">
                                <i class="bi bi-pencil-square"></i>
                            </a>
                            <form th:action="@{/travellers/delete/{id}(id=${t.id})}" method="post" class="m-0">
                                <button type="submit" class="btn-action btn btn-danger shadow-sm" onclick="return confirm('Удалить?')">
                                    <i class="bi bi-trash3"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
        <div th:if="${#lists.isEmpty(travellers)}" class="text-center py-5">
            <i class="bi bi-search fs-1 text-muted"></i>
            <p class="mt-3 text-muted">Ничего не найдено по вашему запросу</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
