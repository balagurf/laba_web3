<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Профиль — Travelling Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .profile-card, .edit-card { border: none; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); overflow: hidden; }
        .profile-header { background: linear-gradient(135deg, #1a237e 0%, #0d47a1 100%); height: 100px; }
        .avatar-wrapper { margin-top: -50px; }
        .avatar-circle {
            width: 100px; height: 100px;
            background: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 4px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .info-label { font-size: 0.8rem; text-transform: uppercase; color: #6c757d; font-weight: 700; }
        .info-value { font-size: 1rem; color: #212529; margin-bottom: 15px; }
        .section-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #6c757d; font-weight: 700; margin-bottom: 1.5rem; }
        .form-control:read-only { background-color: #f8f9fa; color: #6c757d; }
    </style>
</head>
<body>

<div class="container py-5">
    <a th:href="@{/}" class="btn btn-link text-decoration-none mb-4 p-0 text-muted">
        <i class="bi bi-arrow-left"></i> Вернуться в главное меню
    </a>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show border-0 shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card profile-card h-100">
                <div class="profile-header"></div>
                <div class="card-body text-center p-4">
                    <div class="avatar-wrapper mb-3">
                        <div class="mx-auto avatar-circle">
                            <i class="bi bi-person-fill text-primary" style="font-size: 3rem;"></i>
                        </div>
                    </div>
                    <h4 class="fw-bold mb-1" th:text="${username}">user@example.com</h4>
                    <p class="text-muted small mb-4">Учетная запись системы</p>

                    <hr class="text-secondary opacity-25">

                    <div class="text-start mt-4">
                        <div class="info-label">Статус аккаунта</div>
                        <div class="info-value">
                            <span class="badge bg-success-subtle text-success px-3">Активен</span>
                        </div>

                        <div class="info-label mt-3">Роль в системе</div>
                        <div class="info-value">
                            <th:block th:each="role : ${roles}">
                                <span class="badge bg-primary-subtle text-primary me-1" th:text="${role.authority.replace('ROLE_', '')}">USER</span>
                            </th:block>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card edit-card h-100">
                <div class="card-body p-4 p-md-5">
                    <div class="d-flex align-items-center mb-4 pb-3 border-bottom">
                        <div class="bg-primary-subtle text-primary rounded-circle p-2 me-3 d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;">
                            <i class="bi bi-shield-lock fs-5"></i>
                        </div>
                        <h4 class="fw-bold mb-0">Настройки безопасности</h4>
                    </div>

                    <form th:action="@{/profile/update-password}" method="post">

                        <div class="mb-4">
                            <label class="form-label fw-medium small">Системный Email (Логин)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" th:value="${username}" readonly>
                            </div>
                            <div class="form-text text-muted" style="font-size: 0.75rem;">
                                <i class="bi bi-info-circle me-1"></i> Логин не подлежит самостоятельному изменению.
                            </div>
                        </div>

                        <div class="section-title border-bottom pb-2 mt-5">Смена пароля</div>

                        <div class="row g-3 mt-2">
                            <div class="col-md-6">
                                <label class="form-label fw-medium small">Новый пароль</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                    <input type="password" name="newPassword" class="form-control" placeholder="Мин. 6 символов">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium small">Подтверждение пароля</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                                    <input type="password" name="confirmPassword" class="form-control" placeholder="Повторите пароль">
                                </div>
                            </div>
                        </div>

                        <div class="mt-4 pt-2">
                            <button type="submit" class="btn btn-primary fw-bold py-2 px-4 shadow-sm">
                                <i class="bi bi-check2-circle me-2"></i>Обновить пароль
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
