<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Доступ ограничен</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error-card { max-width: 500px; text-align: center; background: white; padding: 3rem; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); }
        .icon-box { font-size: 5rem; color: #dc3545; margin-bottom: 1.5rem; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="error-card">
    <div class="icon-box">
        <i class="bi bi-shield-lock-fill"></i>
    </div>
    <h2 class="fw-bold">Доступ ограничен</h2>
    <p class="text-muted mb-4">
        У вас недостаточно прав для редактирования этих данных. Пожалуйста, обратитесь к администратору, если считаете, что это ошибка.
    </p>
    <div class="d-grid gap-2">
        <a th:href="@{/travellers}" class="btn btn-primary py-2 rounded-pill">Вернуться к списку</a>
        <a th:href="@{/}" class="btn btn-light py-2 rounded-pill border">На главную</a>
    </div>
</div>

</body>
</html>
