<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Travelling Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; }
        .login-wrapper { width: 100%; max-width: 450px; }
        .login-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="login-wrapper">
    <a th:href="@{/}" class="btn btn-link text-decoration-none mb-3 p-0 text-muted">
        <i class="bi bi-arrow-left"></i> Вернуться на главную
    </a>

    <div class="login-card">
        <h3 class="text-center fw-bold mb-4">Вход в систему</h3>

        <div th:if="${param.error}" class="alert alert-danger small py-2 text-center">Неверный email или пароль</div>
        <div th:if="${param.logout}" class="alert alert-info small py-2 text-center">Вы успешно вышли из системы</div>
        <div th:if="${param.registered}" class="alert alert-success small py-2 text-center">Регистрация успешна! Теперь вы можете войти.</div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Email адрес</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="username" class="form-control" placeholder="example@mail.com" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Пароль</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Введите пароль" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mb-3 shadow-sm">Войти</button>

            <div class="text-center">
                <span class="text-muted small">Нет аккаунта?</span>
                <a th:href="@{/register}" class="text-decoration-none fw-bold small">Зарегистрироваться</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
