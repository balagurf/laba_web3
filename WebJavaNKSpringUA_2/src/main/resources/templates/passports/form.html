<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passport Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; padding: 40px 0; }
        .passport-card { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: none; overflow: hidden; }
        .card-header-custom { background: #0033A0; color: white; padding: 25px; border-bottom: 5px solid #FFD100; }
        .section-title { color: #0033A0; font-weight: 800; text-transform: uppercase; font-size: 0.9rem; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .form-control { border-radius: 10px; padding: 12px; border: 1px solid #dee2e6; }
        .readonly-field { background-color: #f8f9fa !important; font-weight: bold; color: #0033A0; }
        .save-btn { background: #16a34a; color: white; border: none; padding: 15px 40px; border-radius: 10px; font-weight: bold; transition: 0.3s; }
        .save-btn:hover { background: #15803d; transform: translateY(-2px); }
        .error-text { color: #dc3545; font-size: 0.85rem; margin-top: 5px; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="passport-card">
                <div class="card-header-custom">
                    <h3 class="mb-0">🛂 AIR PASSPORT REGISTRATION</h3>
                    <small>International Tour Operator CRM System</small>
                </div>

                <div class="card-body p-4 p-lg-5">
                    <form th:action="@{/passports/save}" th:object="${passport}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <!-- ПЕРСОНАЛЬНЫЕ ДАННЫЕ -->
                        <div class="section-title">Personal Information</div>
                        <div class="row g-4 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Имя (Кириллица)</label>
                                <input type="text" id="nameRu" class="form-control" placeholder="Введите имя..." oninput="translateData()">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">First Name (Latin)</label>
                                <input type="text" th:field="*{firstName}" id="nameEn" class="form-control readonly-field" readonly>
                                <span class="error-text" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Фамилия (Кириллица)</label>
                                <input type="text" id="lastRu" class="form-control" placeholder="Введите фамилию..." oninput="translateData()">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Last Name (Latin)</label>
                                <input type="text" th:field="*{lastName}" id="lastEn" class="form-control readonly-field" readonly>
                                <span class="error-text" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
                            </div>
                        </div>

                        <!-- КОНТАКТЫ И ДОКУМЕНТЫ -->
                        <div class="section-title">Documents & Contacts</div>
                        <div class="row g-4 mb-4">
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Tax Code (IDNP)</label>
                                <input type="text" th:field="*{taxCode}" class="form-control" placeholder="13 digits">
                                <span class="error-text" th:if="${#fields.hasErrors('taxCode')}" th:errors="*{taxCode}"></span>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Passport Number</label>
                                <input type="text" th:field="*{passportNumber}" class="form-control readonly-field" readonly>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Country</label>
                                <select th:field="*{countryCode}" class="form-select">
                                    <option th:each="c : ${T(com.example.travelling2.model.CountryCode).values()}"
                                            th:value="${c}" th:text="${c.displayValue}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Phone</label>
                                <input type="text" th:field="*{phone}" class="form-control" placeholder="+373...">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Email</label>
                                <input type="email" th:field="*{email}" class="form-control" placeholder="mail@example.com">
                            </div>
                        </div>

                        <!-- ДАТЫ -->
                        <div class="section-title">Travel Dates</div>
                        <div class="row g-4 mb-4">
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Arrival Date</label>
                                <input type="date" th:field="*{arrivalDate}" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Departure Date</label>
                                <input type="date" th:field="*{departureDate}" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Expiry Date</label>
                                <input type="date" th:field="*{expiryDate}" class="form-control">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted">SYSTEM SECURITY CODE</label>
                            <input type="text" th:field="*{passportCode}" class="form-control readonly-field text-center" style="letter-spacing: 5px;" readonly>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="/passports" class="btn btn-outline-secondary px-5">Назад</a>
                            <button type="submit" class="save-btn">💾 СОХРАНИТЬ ПАСПОРТ</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function transliterate(text) {
        const map = {
            'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'zh','з':'z','и':'i',
            'й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t',
            'у':'u','ф':'f','х':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'',
            'э':'e','ю':'yu','я':'ya'
        };
        return text.toLowerCase().split('').map(char => map[char] || char).join('')
                   .replace(/\b\w/g, l => l.toUpperCase());
    }

    function translateData() {
        document.getElementById('nameEn').value = transliterate(document.getElementById('nameRu').value);
        document.getElementById('lastEn').value = transliterate(document.getElementById('lastRu').value);
    }
</script>
</body>
</html>
