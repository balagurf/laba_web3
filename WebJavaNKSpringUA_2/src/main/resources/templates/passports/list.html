<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Passport Registry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Стили для модального окна удаления */
        .custom-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1050;
            justify-content: center;
            align-items: center;
        }
        .custom-modal-content {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .modal-header-custom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .generated-code {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 3px;
            background: #f8f9fa;
            padding: 10px;
            margin: 15px 0;
            border: 2px dashed #dc3545;
            color: #dc3545;
        }
        .timer-text {
            font-weight: bold;
            color: #6c757d;
            margin-bottom: 15px;
        }
        .delete-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            text-align: center;
            text-transform: uppercase;
        }
        .delete-btn {
            width: 100%;
            padding: 10px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .delete-btn:hover { background: #a71d2a; }
        .close-modal-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; }
    </style>
</head>

<body class="bg-light">

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>🛂 Passport Registry</h2>
        <div class="d-flex gap-2">
            <a href="/" class="btn btn-dark">🏠 Главная</a>
            <a href="/passports/create" class="btn btn-primary">+ Add Passport</a>
        </div>
    </div>

    <form method="get" action="/passports" class="row mb-4">
        <div class="col-md-10">
            <input type="text" name="search" class="form-control"
                   placeholder="Search by passport code..." th:value="${param.search}">
        </div>
        <div class="col-md-2">
            <button class="btn btn-dark w-100">Search</button>
        </div>
    </form>

    <table class="table table-bordered table-hover bg-white shadow">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>FULL NAME</th>
            <th>PHONE</th>
            <th>EMAIL</th>
            <th>TAX CODE</th>
            <th>PASSPORT CODE</th>
            <th>INSURANCE</th>
            <th>ACTIONS</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${passports}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.lastName + ' ' + p.firstName}"></td>
            <td th:text="${p.phone}"></td>
            <td th:text="${p.email}"></td>
            <td th:text="${p.taxCode}"></td>
            <td style="font-size: 12px;" th:text="${p.passportCode}"></td>
            <td th:text="${p.insuranceType}"></td>
            <td>
                <div class="btn-group">
                    <a th:href="@{/passports/edit/{id}(id=${p.id})}"
                       class="btn btn-warning btn-sm">Edit</a>

                    <button type="button" class="btn btn-danger btn-sm"
                            th:onclick="'openDeleteModal(' + ${p.id} + ')'">
                        Delete
                    </button>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div id="deleteModal" class="custom-modal">
    <div class="custom-modal-content">
        <div class="modal-header-custom">
            <h4 class="mb-0">⚠ Secure Delete</h4>
            <button onclick="closeDeleteModal()" class="close-modal-btn">✕</button>
        </div>
        <p class="text-muted small">
            Enter the generated code within 60 seconds to delete the passport.
        </p>
        <div id="generatedDeleteCode" class="generated-code"></div>
        <div id="timer" class="timer-text">60s</div>

        <form id="deleteForm" method="post">
            <input type="hidden" id="actualDeleteCode" name="actualCode">
            <input type="text" name="confirmCode" class="delete-input"
                   placeholder="Enter code here..." required autocomplete="off">
            <button type="submit" class="delete-btn">CONFIRM DESTRUCTION</button>
        </form>
    </div>
</div>

<script>
    let deleteTimer;
    let seconds = 60;

    function generateCode() {
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        let code = "";
        for (let i = 0; i < 8; i++) {
            code += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return code;
    }

    function openDeleteModal(id) {
        const code = generateCode();

        document.getElementById("generatedDeleteCode").innerText = code;
        document.getElementById("actualDeleteCode").value = code;

        // Устанавливаем путь для Action формы
        document.getElementById("deleteForm").action = "/passports/delete/" + id;

        // Показываем окно
        document.getElementById("deleteModal").style.display = "flex";

        // Таймер
        seconds = 60;
        updateTimer();

        clearInterval(deleteTimer);
        deleteTimer = setInterval(() => {
            seconds--;
            updateTimer();
            if (seconds <= 0) {
                clearInterval(deleteTimer);
                closeDeleteModal();
            }
        }, 1000);
    }

    function updateTimer() {
        document.getElementById("timer").innerText = seconds + "s";
    }

    function closeDeleteModal() {
        document.getElementById("deleteModal").style.display = "none";
        clearInterval(deleteTimer);
        // Очищаем поле ввода при закрытии
        document.querySelector('input[name="confirmCode"]').value = "";
    }

    // Закрытие модалки при клике вне контента
    window.onclick = function(event) {
        let modal = document.getElementById("deleteModal");
        if (event.target === modal) {
            closeDeleteModal();
        }
    }
</script>

</body>
</html>
