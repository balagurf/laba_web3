<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Travelling App - Главная</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5 text-center">
    <h1 class="display-4 mb-4">Система управления путешествиями 🌍</h1>
    <p class="lead mb-5">Добро пожаловать! Выберите раздел для работы:</p>

    <div class="row g-4 justify-content-center">
        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h3>🗺️ Путешественники</h3>
                    <p class="text-muted">Управление списком клиентов и их депозитами.</p>
                    <a th:href="@{/travellers}" class="btn btn-primary w-100">Перейти</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h3>🆔 Паспорта</h3>
                    <p class="text-muted">Просмотр и удаление паспортных данных.</p>
                    <a th:href="@{/passports}" class="btn btn-dark w-100">Перейти</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
